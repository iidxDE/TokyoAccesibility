# Swept hyperparameters + protocol knobs (DVC-tracked; change -> stage reruns).

seed: 42
target_transform: log1p        # model predicts ln(1 + y)

# Spatial cross-validation: grid blocks primary, ward folds as robustness check.
# Both the inner tuning loop and outer eval loop use this same block logic.
spatial_cv:
  strategy: grid               # grid | ward
  grid_size_km: 5
  n_splits: 8
  shuffle: false

# Servable-model selection (restricted to the no_daily_stop_events variant).
model_selection:
  primary_metric: r2_mean       # OOF log-R2, higher better
  tie_breaker: mae_log_mean     # lower better
  servable_variant: no_daily_stop_events

# Model roster (Phase 4). Fixed n_estimators; sweep the anti-overfitting knobs.
models:
  dummy:
    estimator: dummy            # variant-invariant floor; no grid
    grid: {}
  ridge:
    estimator: ridge
    grid:
      alpha: [0.1, 1.0, 10.0, 100.0]
  random_forest:
    estimator: random_forest
    fixed: { n_estimators: 300 }
    grid:
      min_samples_leaf: [1, 3, 5]
      max_features: [0.5, 1.0]
  gradient_boosting:
    estimator: gradient_boosting
    fixed: { n_estimators: 300 }
    grid:
      max_depth: [2, 3]
      learning_rate: [0.05, 0.1]
  lightgbm:
    estimator: lightgbm
    fixed: { n_estimators: 500, min_child_samples: 20 }
    grid:
      num_leaves: [15, 31, 63]
      learning_rate: [0.03, 0.05]

# Endogeneity experiment: which feature configurations to run through the harness.
endogeneity_variants:
  - full
  - no_daily_stop_events       # servable variant (greenfield-usable)
  - stop_events_only

# Prediction intervals.
intervals:
  method: conformal            # conformal (MAPIE) | quantile
  confidence_level: 0.9

# Residual spatial-autocorrelation diagnostics on out-of-fold residuals.
residuals:
  moran: true
  lisa: true
  n_permutations: 999
