[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokyo-ridership"
version = "0.0.0"
description = "Station-level daily ridership prediction and transit-equity analysis for the Tokyo rail network"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Core runtime: data intake, feature engineering, modeling, explanation.
# Pinned as lower bounds to the versions validated in the project venv.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "networkx>=3.2",
    "matplotlib>=3.8",
    "shap>=0.44",
]

[project.optional-dependencies]
# Phase 2 — post-paper feature families.
features = [
    "osmnx>=1.9",
]
# Phase 3-4 — extended model roster + spatial residual stats. (Prediction
# intervals use in-house split-conformal from OOF residuals, no extra dep.)
models = [
    "lightgbm>=4.3",
    "libpysal>=4.9",
    "esda>=2.5",
]
# Phase 5 — inference service.
serving = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",  # fastapi TestClient (serving tests)
]
# Phase 6 — Streamlit frontend (HTTP client of the API only).
# streamlit>=1.39 is the floor validated for the APIs the app uses: st.tabs,
# st.altair_chart, and — the binding constraint — st.pydeck_chart's on_select
# selections for Page 2's click-to-prefill, which only exist from 1.39 (1.38
# raises TypeError on on_select). altair ships with Streamlit but is pinned
# explicitly because viz/maps.py builds the ward chart with it.
app = [
    "streamlit>=1.39",
    "altair>=5",
    "requests>=2.31",
    "pydeck>=0.9",
]
# Tooling / CI / reproducibility.
dev = [
    "ruff>=0.4",
    "mypy>=1.9",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "dvc>=3.50",
    "pandas-stubs",
    "types-requests",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tokyo_ridership"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]
# Legacy prototype + exploratory notebook: ported into src/ across Phases 1-2,
# not linted in the meantime (CLAUDE.md: notebooks narrate, logic lives in src/).
extend-exclude = [
    "main.py",
    "data/feature_build.py",
    "data/filter_gtfs.py",
    "*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "app"]  # "app" so tests can import the thin api_client
addopts = "-q"
