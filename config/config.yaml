# Central configuration: paths, source filenames, feature lists.
# Hyperparameters that get swept live in params.yaml (DVC-tracked).

paths:
  data_raw: data/raw            # external downloads (gitignored, DVC-tracked)
  data_interim: data/interim    # filtered GTFS + clean intermediate tables
  data_processed: data/processed
  models: models
  reports: reports

# Clean intermediate tables written by the Phase 1 loaders (under paths.data_interim).
interim:
  gtfs_stops: gtfs_stops.parquet
  gtfs_stop_times: gtfs_stop_times.parquet
  gtfs_trips: gtfs_trips.parquet
  gtfs_routes: gtfs_routes.parquet
  ridership: ridership.parquet
  census_chome: census_chome.parquet   # geoparquet: chome population + geometry
  landuse_mesh: landuse_mesh.parquet    # collapsed land-use class + geometry (metric CRS)

# Assembled feature matrix written by Phase 2 (under paths.data_processed).
processed:
  station_features: station_features.parquet

# Raw source filenames, resolved under paths.data_raw unless noted.
# Mirrors the prototype in data/feature_build.py.
sources:
  gtfs:
    stops: stops.txt
    stop_times: stop_times.txt
    trips: trips.txt
    routes: routes.txt
  gtfs_filtered:              # produced by the bbox filter (Phase 1), in interim/
    stops: stops_tokyo.txt
    stop_times: stop_times_tokyo.txt
    trips: trips_tokyo.txt
  wards_geojson: tokyo23.json
  mlit_ridership_shp: S12-20_GML/S12-20_GML/S12-20_NumberOfPassengers.shp
  census_population: tokyo_chocho_population.txt
  census_boundaries: tokyo_chocho_boundaries.shp
  # MLIT L03-b land-use mesh 5339. The .shp shipped without its .dbf (no
  # attributes), so we read the self-contained geojson (geometry + class).
  landuse_mesh: L03-b-21_5339.geojson

# Tokyo bounding box used to pre-filter the Kanto-wide GTFS feed.
bbox:
  min_lat: 35.50
  max_lat: 35.85
  min_lon: 139.55
  max_lon: 139.92

# The Yamanote Line is the network reference point (BFS source + distance anchor).
yamanote_route_id: JR-East.Yamanote

# Feature groups. `servable_exclude` is dropped from the greenfield-siting model
# because a hypothetical new station has no schedule (CLAUDE.md rule 4).
features:
  connectivity:
    - n_routes
    - min_transfers_yamanote
    - mean_route_degree_cent
    - mean_route_btw_cent
    - max_route_btw_cent
  service:
    - daily_stop_events
  geography:
    - km_to_yamanote
  demographics:
    - pop_800m_catchment
  landuse:                    # MLIT L03-b land-use composition within the catchment
    - landuse_built_frac
    - landuse_mix
  categorical:
    - ward_jp
    - station_mode   # transport mode: rail/subway/monorail/agt/tram (mode signal)
  # Deferred. employment_800m awaits the Economic-Census <-> Population-Census
  # area correspondence (the two use incompatible chome codes; name join ~93%).
  planned:
    - employment_800m
    - poi_density_800m

servable_exclude:
  - daily_stop_events

target:
  raw: ridership_2019
  transformed: log_ridership   # ln(1 + y); serving owns the expm1 inverse

# Catchment radius (metres) for population / POI aggregation around a station.
catchment_radius_m: 800

# Tokyo coordinate bounds enforced by the serving layer (Pydantic -> 422).
serving_bounds:
  min_lat: 35.50
  max_lat: 35.90
  min_lon: 139.50
  max_lon: 139.95
